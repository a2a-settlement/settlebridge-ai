[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlebridge-assurance"
version = "0.1.0"
description = "Private agent-assurance runner for one settlement workflow"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
assurance = "assurance.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["assurance*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
assurance = ["scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
