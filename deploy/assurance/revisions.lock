# Single compatibility manifest for the private experiment profile.
# Docker build args are generated from this file. Do not put SHAs in Dockerfiles.
# These pins are the last published revisions. A deployable check fails while a
# required path is absent from that revision. Build the images from the
# checkouts that contain the implementation, then commit and move these pins.
