[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "settlebridge-backend"
version = "1.4.0"
description = "SettleBridge Gateway — trust and policy enforcement for agent-to-agent settlement"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "httpx>=0.28.0",
  "python-multipart>=0.0.18",
  "cryptography>=44.0.0",
  "redis[hiredis]>=5.0.0",
  "pyyaml>=6.0.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "croniter>=6.0.0",
  "jsonschema>=4.23.0",
  "anthropic>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["**/*.json", "**/*.yaml", "**/*.yml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
